<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 24" role="img"><title>Art Deco divider</title>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E5C77A"/><stop offset=".45" stop-color="#C9A24B"/><stop offset=".7" stop-color="#F3DD9A"/><stop offset="1" stop-color="#8A6A2A"/>
  </linearGradient>
  <linearGradient id="goldv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E5C77A"/><stop offset=".5" stop-color="#C9A24B"/><stop offset="1" stop-color="#7A5C22"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".38" r=".75">
    <stop offset="0" stop-color="#3B2D14"/><stop offset=".55" stop-color="#17130C"/><stop offset="1" stop-color="#0B0B0B"/>
  </radialGradient>
  <radialGradient id="bulb" cx=".5" cy=".5" r=".5">
