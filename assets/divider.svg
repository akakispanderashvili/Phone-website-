  </pattern>
  <pattern id="hatchd" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <line x1="0" y1="0" x2="0" y2="3.2" stroke="#C9A24B" stroke-width=".8" opacity=".5"/>
  </pattern>
